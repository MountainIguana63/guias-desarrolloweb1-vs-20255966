<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bootstrap (solo la hoja de estilos, no se usa su JavaScript) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="../js/pedidos.js" defer></script>
    <title>Pedidos de la cafetería</title>
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <h1 class="text-center mb-4">Gestión de pedidos de la cafetería</h1>

      <!-- Formulario para registrar pedidos -->
      <div class="card mb-4">
        <div class="card-header fw-bold">Nuevo pedido</div>
        <div class="card-body">
          <form id="idFormPedido" novalidate>
            <div class="row g-3">
              <div class="col-md-5">
                <label for="idProducto" class="form-label">Producto</label>
                <input
                  type="text"
                  id="idProducto"
                  class="form-control"
                  placeholder="Ej. Café americano"
                  required
                />
              </div>
              <div class="col-md-3">
                <label for="idPrecio" class="form-label">Precio unitario ($)</label>
                <input
                  type="number"
                  id="idPrecio"
                  class="form-control"
                  placeholder="0.00"
                  step="0.01"
                  min="0.01"
                  required
                />
              </div>
              <div class="col-md-2">
                <label for="idCantidad" class="form-label">Cantidad</label>
                <input
                  type="number"
                  id="idCantidad"
                  class="form-control"
                  placeholder="1"
                  step="1"
                  min="1"
                  required
                />
              </div>
              <div class="col-md-2 d-flex align-items-end">
                <button type="submit" id="idBtnAgregar" class="btn btn-primary w-100">
                  Agregar pedido
                </button>
              </div>
            </div>
          </form>
          <div id="idMensaje" class="mt-3"></div>
        </div>
      </div>

      <!-- Filtro por precio máximo -->
      <div class="card mb-4">
        <div class="card-body">
          <div class="row g-3 align-items-end">
            <div class="col-md-4">
              <label for="idPrecioMaximo" class="form-label">Precio máximo ($)</label>
              <input
                type="number"
                id="idPrecioMaximo"
                class="form-control"
                placeholder="Ej. 3.00"
                step="0.01"
                min="0"
              />
            </div>
            <div class="col-md-8 d-flex gap-2 flex-wrap">
              <button type="button" id="idBtnFiltrar" class="btn btn-secondary">
                Filtrar productos
              </button>
              <button type="button" id="idBtnMostrarTodos" class="btn btn-outline-secondary">
                Mostrar todos
              </button>
              <button type="button" id="idBtnLimpiar" class="btn btn-danger ms-md-auto">
                Limpiar pedidos
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Tabla de pedidos -->
      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle bg-white">
          <thead class="table-dark">
            <tr>
              <th scope="col">Producto</th>
              <th scope="col" class="text-end">Precio unitario</th>
              <th scope="col" class="text-end">Cantidad</th>
              <th scope="col" class="text-end">Subtotal</th>
            </tr>
          </thead>
          <tbody id="idCuerpoTabla"></tbody>
        </table>
      </div>
      <p id="idEstadoFiltro" class="text-muted small"></p>

      <!-- Indicadores -->
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <div class="card text-center">
            <div class="card-body">
              <h6 class="card-subtitle text-muted mb-1">Total de unidades solicitadas</h6>
              <span id="idTotalUnidades" class="fs-3 fw-bold">0</span>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card text-center">
            <div class="card-body">
              <h6 class="card-subtitle text-muted mb-1">Monto total de los pedidos</h6>
              <span id="idMontoTotal" class="fs-3 fw-bold">$0.00</span>
            </div>
          </div>
        </div>
      </div>

      <a href="../index.html" class="btn btn-primary w-100">Regresar</a>
    </div>
  </body>
</html>
